[project]
name = "microduck-head-stabilization"
version = "0.1.0"
description = "A reproducible MuJoCo experiment for Microduck head stabilization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[project.optional-dependencies]
report = ["reportlab>=5.1,<6", "pypdf>=7.1,<8"]
